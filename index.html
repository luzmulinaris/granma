<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Los últimos años de Pablo Escobar y la llamada que llevó a su caída</title>
    <meta
      name="description"
      content="De la entrega negociada en La Catedral a la fuga y la persecución: un recorrido por los acontecimientos, los protagonistas y las llamadas que permitieron localizar al jefe del cartel más grande de Colombia."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Alegreya+Sans+SC:wght@400;500&family=Faustina:wght@400;600&family=Fira+Sans+Condensed:ital,wght@0,500;0,700;0,900;1,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="cabecera">
      <div class="cabecera__rojo"></div>
      <div class="cabecera__in">
        <button class="menu-btn" type="button" aria-label="Abrir índice" aria-expanded="false" aria-controls="indice">
          <i></i><i></i><i></i>
        </button>
        <img class="logo" src="/svg/logo.svg" alt="Granma" width="292" height="75" />
      </div>
    </header>

    <nav class="indice" id="indice" aria-label="Índice de núcleos" hidden>
      <ol class="indice__lista"></ol>
    </nav>

    <main id="historia"></main>

    <p class="aviso-giro" role="note">Girá el teléfono para ver la historia en grande</p>

    <footer class="pie">
      <p>
        Trabajo académico de diseño gráfico. Pieza de práctica sin fines comerciales y sin vínculo con el diario
        <em>Granma</em>. Las fotografías pertenecen a sus respectivos autores y archivos.
      </p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
